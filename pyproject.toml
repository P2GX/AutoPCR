[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "autopcr"
dynamic = ["version"]
description = "A wrapper around Yicheng Tao's AutoPCR algorithm."
authors = [{ name = "Rouven Reuter" }]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

dependencies = [
    "nltk>=3.5",
    "numpy>=2.1",
    "transformers>=4.4",
    "faiss-cpu>=1.9",
    "requests>=2.3",
    "torch>=2.2",
    "stanza>=1.1",
    "spacy>=3.7",
    "benepar>=0.2",
    "spacy-curated-transformers>=0.3",
    "openai >= 3.41",
]
[project.optional-dependencies]
abbreviations = ["scispacy>=0.6"]

[project.urls]
homepage = "https://www.smart-monkey.blog/"
repository = "https://github.com/SmartMonkey-git/AutoPCR"
documentation = "https://github.com/SmartMonkey-git/AutoPCR"
bugtracker = "https://github.com/SmartMonkey-git/AutoPCR/issues"

[tool.setuptools]
packages.find = { where = ["src"] }

[tool.setuptools_scm]
version_file = "src/autopcr/_version.py"

[tool.pytest.ini_options]
addopts = "-s"